name: Fix upgrader inventory instances

on:
  push:
    branches:
      - terminal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch upgrader inventory behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/upgrade/page.tsx')
          text = path.read_text()
          old = 'setInventory((current) => [won, ...current.filter((item) => item.id !== data.inputItem?.id && item.id !== won.id && item.name.toLowerCase() !== won.name.toLowerCase())]);'
          new = 'setInventory((current) => [won, ...current.filter((item) => item.id !== data.inputItem?.id && item.id !== won.id)]);'
          if old not in text:
              raise SystemExit('expected upgrader inventory line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/upgrade/page.tsx
          git rm .github/workflows/fix-upgrader-inventory.yml
          git commit -m "fix: keep duplicate upgrader rewards visible"
          git push

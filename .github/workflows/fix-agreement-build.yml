name: Fix agreement build

on:
  push:
    branches:
      - terminal

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: terminal
          fetch-depth: 0
      - name: Fix agreement key type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/agreement/page.tsx')
          s = p.read_text()
          old = '<section key={title}>'
          new = '<section key={typeof title === "string" ? title : title.join("-")}>'
          if old not in s:
              raise SystemExit('Expected agreement key expression was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/agreement/page.tsx
          git commit -m 'fix: resolve agreement section key type' || exit 0
          git push origin terminal

name: Fix bonus wheel visuals

on:
  push:
    branches: [terminal]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: terminal
          fetch-depth: 0
      - name: Patch bonus wheel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/app/bonuses/wheel/page.tsx')
          s = page.read_text()
          s = s.replace('const image = isLetter && letter ? letterImages[letter] : isCashback ? CASHBACK_SRC : undefined;', 'const image = isLetter ? (letter ? letterImages[letter] : letterImages["Z"]) : isCashback ? CASHBACK_SRC : undefined;')
          s = s.replace('const isCashback = item.type === "CASHBACK" || item.label.toLowerCase().includes("cashback") || item.label.toLowerCase().includes("кешбек") || item.label.toLowerCase().includes("кэшбек");', 'const isCashback = item.type === "CASHBACK" || item.type === "DEPOSIT_BONUS" || item.label.toLowerCase().includes("cashback") || item.label.toLowerCase().includes("кешбек") || item.label.toLowerCase().includes("кэшбек");')
          s = s.replace('className="h-[92%] w-[92%] object-contain drop-shadow-[0_0_12px_rgba(255,160,70,.55)]"', 'className={`object-contain drop-shadow-[0_0_12px_rgba(255,160,70,.55)] ${isCashback ? "h-[96%] w-[96%]" : "h-[92%] w-[92%]"}`}')
          s = s.replace('selected={selected === i}', 'selected={result?.rewardType === item.type}')
          old = '''function InnerRoulette({ data, spinning }: { data: InnerRouletteData; spinning: boolean }) {\n  const items = Array.from({ length: 9 }, () => data.items).flat();\n  const target = data.selectedIndex + data.items.length * 4;\n  const card = 116;\n  return <div className="absolute inset-x-[4%] top-1/2 z-50 -translate-y-1/2 rounded-[24px] border border-orange-300/25 bg-[#070910]/[.98] p-3 shadow-[0_30px_100px_rgba(0,0,0,.95)] backdrop-blur-xl sm:inset-x-[7%] sm:p-4">\n    <div className="mb-2 flex items-center justify-between px-1 text-[8px] font-black uppercase tracking-[.2em]"><span className="text-slate-500">Финальный дроп</span><span className="text-orange-300">{data.title}</span></div>\n    <div className="relative overflow-hidden rounded-xl border border-white/10 bg-[#020409] py-3">\n      <div className="pointer-events-none absolute inset-y-0 left-1/2 z-30 w-[3px] -translate-x-1/2 bg-orange-300 shadow-[0_0_22px_rgba(251,146,60,.95)]" />\n      <div className="flex w-max gap-2" style={{ transform: `translateX(calc(50% - ${card / 2}px - ${target * (card + 8)}px))`, transition: spinning ? "transform 4.25s cubic-bezier(.08,.72,.12,1)" : "transform .3s ease-out" }}>'''
          new = '''function InnerRoulette({ data, spinning }: { data: InnerRouletteData; spinning: boolean }) {\n  const items = Array.from({ length: 9 }, () => data.items).flat();\n  const target = data.selectedIndex + data.items.length * 4;\n  const card = 116;\n  const [offset, setOffset] = useState(0);\n\n  useEffect(() => {\n    setOffset(0);\n    if (!spinning) return;\n    const frame = window.requestAnimationFrame(() => setOffset(target));\n    return () => window.cancelAnimationFrame(frame);\n  }, [data.selectedIndex, data.items.length, target, spinning]);\n\n  return <div className="absolute inset-x-[4%] top-1/2 z-50 -translate-y-1/2 rounded-[24px] border border-orange-300/25 bg-[#070910]/[.98] p-3 shadow-[0_30px_100px_rgba(0,0,0,.95)] backdrop-blur-xl sm:inset-x-[7%] sm:p-4">\n    <div className="mb-2 flex items-center justify-between px-1 text-[8px] font-black uppercase tracking-[.2em]"><span className="text-slate-500">Финальный дроп</span><span className="text-orange-300">{data.title}</span></div>\n    <div className="relative overflow-hidden rounded-xl border border-white/10 bg-[#020409] py-3">\n      <div className="pointer-events-none absolute inset-y-0 left-1/2 z-30 w-[3px] -translate-x-1/2 bg-orange-300 shadow-[0_0_22px_rgba(251,146,60,.95)]" />\n      <div className="flex w-max gap-2" style={{ transform: `translateX(calc(50% - ${card / 2}px - ${offset * (card + 8)}px))`, transition: spinning ? "transform 4.25s cubic-bezier(.08,.72,.12,1)" : "transform .3s ease-out" }}>'''
          if old in s:
              s = s.replace(old, new, 1)
          page.write_text(s)

          route = Path('src/app/api/bonuses/fortune/route.ts')
          r = route.read_text()
          marker = 'label = `Z-Coin Rain: +${selected} Z-Coin`; metadata = { bonusType: reward.type, amount: selected };'
          grant = '''label = `Z-Coin Rain: +${selected} Z-Coin`; metadata = { bonusType: reward.type, amount: selected };\n    await prisma.$transaction(async (tx) => {\n      await tx.user.update({ where: { id: user.id }, data: { balance: { increment: selected } } });\n      await tx.transaction.create({ data: { userId: user.id, type: "ZCOIN_GRANT", zCoinAmount: selected, status: "SUCCESS" } });\n      await tx.operation.create({ data: { userId: user.id, type: "ZCOIN_GRANT", label: `Z-Coin Rain: ${selected} Z-Coin`, amount: selected, status: "SUCCESS", idempotencyKey: `fortune-zcoin-grant:${idempotencyKey}` } });\n    });'''
          if marker in r:
              r = r.replace(marker, grant, 1)
          route.write_text(r)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/bonuses/wheel/page.tsx src/app/api/bonuses/fortune/route.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix bonus wheel cashback and coin roulette"
          git push origin terminal

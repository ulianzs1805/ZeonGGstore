name: Apply upgrade PNG shard fix

on:
  push:
    branches: [terminal]

permissions:
  contents: write

jobs:
  apply-fix:
    if: "!contains(github.event.head_commit.message, 'chore: apply real PNG shard animation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: terminal
          fetch-depth: 0
      - name: Apply real PNG shard animation
        run: |
          python3 scripts/fix-upgrade-shards.py
          python3 scripts/fix-upgrade-shard-anchors.py
      - name: Check whether the page changed
        id: changed
        run: |
          if git diff --quiet -- src/app/upgrade/page.tsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit fixed animation
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/upgrade/page.tsx
          git commit -m "chore: apply real PNG shard animation"
          git push origin HEAD:terminal
